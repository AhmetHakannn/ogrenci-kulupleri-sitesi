<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üyelik Formu - Öğrenci Kulüpleri</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-people-fill me-2"></i>Öğrenci Kulüpleri
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="kulupler.html"><i class="bi bi-collection me-1"></i>Kulüpler</a></li>
                    <li class="nav-item"><a class="nav-link active" href="uyelik.html"><i class="bi bi-file-earmark-text me-1"></i>Üyelik Formu</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <h2 class="mb-4"><i class="bi bi-pen me-2"></i>Kulüp Üyelik Formu</h2>

                <!-- PROGRESS BAR -->
                <div class="progress mb-4 shadow-sm" role="progressbar" aria-label="Başvuru İlerlemesi" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 60%">Başvuru %60</div>
                </div>

                <!-- FORM -->
                <form class="p-4 bg-light rounded-3 shadow-sm border">
                    <div class="mb-3">
                        <label for="ad" class="form-label fw-semibold">Ad Soyad</label>
                        <input type="text" class="form-control" id="ad" placeholder="Adınız Soyadınız" required>
                    </div>

                    <div class="mb-3">
                        <label for="mail" class="form-label fw-semibold">E-posta</label>
                        <input type="email" class="form-control" id="mail" placeholder="ornek@mail.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="kulup" class="form-label fw-semibold">Kulüp Seçimi</label>
                        <select class="form-select" id="kulup" required>
                            <option value="" selected disabled>Bir kulüp seçin</option>
                            <option value="yazilim">Yazılım Kulübü</option>
                            <option value="tiyatro">Tiyatro Kulübü</option>
                            <option value="doga">Doğa Sporları Kulübü</option>
                            <option value="satranc">Satranç Kulübü</option>
                            <option value="girisim">Girişimcilik Kulübü</option>
                            <option value="gonullu">Gönüllülük Kulübü</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block fw-semibold">Sınıfınız</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sinif" id="s1" value="1" checked>
                            <label class="form-check-label" for="s1">1</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sinif" id="s2" value="2">
                            <label class="form-check-label" for="s2">2</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sinif" id="s3" value="3">
                            <label class="form-check-label" for="s3">3</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sinif" id="s4" value="4">
                            <label class="form-check-label" for="s4">4</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="neden" class="form-label fw-semibold">Neden katılmak istiyorsunuz?</label>
                        <textarea class="form-control" id="neden" rows="3"></textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="onay" required>
                        <label class="form-check-label text-muted" for="onay">Kişisel verilerimin işlenmesini kabul ediyorum.</label>
                    </div>

                    <div class="d-grid gap-2 d-md-block">
                        <button type="submit" class="btn btn-success me-md-2"><i class="bi bi-send me-1"></i> Başvuruyu Gönder</button>
                        <a href="kulupler.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Kulüplere Dön</a>
                    </div>
                </form>

                <!-- TABLO -->
                <h4 class="mt-5 mb-3"><i class="bi bi-list-check me-2"></i>Başvuru Aşamaları</h4>
                <div class="table-responsive shadow-sm rounded">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Aşama</th>
                                <th scope="col">Süre</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row">1</th>
                                <td>Formu doldur</td>
                                <td>5 dk</td>
                            </tr>
                            <tr>
                                <th scope="row">2</th>
                                <td>Kulüp başkanı değerlendirir</td>
                                <td>2 gün</td>
                            </tr>
                            <tr>
                                <th scope="row">3</th>
                                <td>E-posta ile bilgilendirme</td>
                                <td>1 gün</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 Öğrenci Kulüpleri</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
